<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | Battery Telemetry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Auto-refresh every 30 seconds to see new data -->
    <meta http-equiv="refresh" content="30">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="max-w-2xl mx-auto py-20 px-6">
        <header class="mb-12">
            <h1 class="text-4xl font-bold tracking-tight">Device Status</h1>
            <p class="text-gray-500 mt-2">Real-time telemetry from duchamp</p>
        </header>

        <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-400 uppercase tracking-widest">Battery Level</p>
                    <p class="text-6xl font-bold mt-2">{{ level }}%</p>
                </div>
                <!-- Simple battery icon logic -->
                <div class="h-16 w-16 bg-green-100 rounded-2xl flex items-center justify-center">
                    <div class="text-green-600 text-2xl font-bold">⚡</div>
                </div>
            </div>
            
            <div class="mt-8 pt-8 border-t border-gray-50 flex justify-between items-center text-sm text-gray-400">
                <span>Last updated: {{ timestamp }}</span>
                <span class="flex items-center">
                    <span class="h-2 w-2 bg-green-500 rounded-full mr-2"></span> System Online
                </span>
            </div>
        </div>
    </div>
</body>
</html>
