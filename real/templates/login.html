<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | Gatekeeper Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-96">
        <h1 class="text-2xl text-white font-bold mb-6 text-center tracking-tight">Secure Access Portal</h1>
        <form action="/api/login" method="post" class="flex flex-col gap-4">
            <input type="text" name="username" placeholder="Username" required class="px-4 py-2.5 rounded-xl bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-blue-500 text-sm">
            <input type="password" name="password" placeholder="Password" required class="px-4 py-2.5 rounded-xl bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-blue-500 text-sm">
            <button type="submit" class="bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-500 transition text-sm shadow-md">Authenticate Keys</button>
        </form>
    </div>
</body>
</html>
